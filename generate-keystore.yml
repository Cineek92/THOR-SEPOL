name: Generate signing keystore

# Uruchamiany RĘCZNIE, jeden raz. Tworzy stały klucz podpisu APK, aby kolejne
# wersje instalowały się jako aktualizacja (bez utraty bazy IndexedDB na telefonie).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-24.04
    steps:
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generuj keystore i plik z wartościami sekretów
        run: |
          set -euo pipefail
          mkdir -p out
          PASS="$(openssl rand -hex 20)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -noprompt \
            -keystore out/thor-release.jks -storetype PKCS12 \
            -alias thor -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=THOR MQC Inspection, OU=MQC W/M, O=Samsung Electronics Poland Manufacturing, C=PL"
          {
            echo "Dodaj w: Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "Nazwa: THOR_KEYSTORE_PASSWORD"
            echo "Wartość: $PASS"
            echo ""
            echo "Nazwa: THOR_KEY_ALIAS"
            echo "Wartość: thor"
            echo ""
            echo "Nazwa: THOR_KEYSTORE_BASE64"
            echo "Wartość: (cała zawartość pliku THOR_KEYSTORE_BASE64.txt)"
            echo ""
            echo "Po dodaniu sekretów USUŃ ten artefakt z zakładki Actions i zachowaj plik .jks w bezpiecznym miejscu."
          } > out/SEKRETY.txt
          base64 -w0 out/thor-release.jks > out/THOR_KEYSTORE_BASE64.txt

      - name: Artefakt (prywatny dla użytkowników repozytorium)
        uses: actions/upload-artifact@v4
        with:
          name: thor-signing-keystore
          path: out/
          retention-days: 1
